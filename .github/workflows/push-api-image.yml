name: Push FindAnything API Image

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-north-1
  AWS_ACCOUNT_ID: "884975483646"
  ECR_REPOSITORY: findanything-api

jobs:
  build-and-push:
    name: Build and push API image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Temporary debugging step.
      # It prints the OIDC claims but does not print the full token.
      - name: Show GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "${RESPONSE}" | jq -r '.value')

          if [ -z "${TOKEN}" ] || [ "${TOKEN}" = "null" ]; then
            echo "GitHub did not return an OIDC token."
            exit 1
          fi

          PAYLOAD=$(echo "${TOKEN}" | cut -d "." -f 2)

          python3 - "${PAYLOAD}" <<'PY'
          import base64
          import json
          import sys

          payload = sys.argv[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload.encode()).decode()
          )

          keys = [
              "sub",
              "aud",
              "repository",
              "repository_id",
              "repository_owner",
              "repository_owner_id",
              "ref",
              "ref_type",
              "event_name",
              "workflow",
          ]

          print("\nGitHub OIDC claims:")
          for key in keys:
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Get temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: FindAnything-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Confirm AWS identity
        shell: bash
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Building ${IMAGE_URI}"

          docker build \
            --platform linux/amd64 \
            --tag "${IMAGE_URI}" \
            .

          docker push "${IMAGE_URI}"

          echo "Image pushed successfully:"
          echo "${IMAGE_URI}"

          echo "### FindAnything API image" >> "${GITHUB_STEP_SUMMARY}"
          echo "\`${IMAGE_URI}\`" >> "${GITHUB_STEP_SUMMARY}"
